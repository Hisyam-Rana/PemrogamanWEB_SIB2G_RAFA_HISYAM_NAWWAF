<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SIMPUS-Mini - Register New Member</title>
</head>
<body>
    <header>
        <h1>SIMPUS-Mini</h1>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="books/list.html">Book List</a></li>

                <li><a href="members/add.html">Add Member</a></li>
            </ul>
        </nav>
    </header>
    
    <h2>Register New Member</h2>

    <form action="" method="post">
        <table>
            <tr>
                <td><label for="name">Name</label></td>
                <td>:</td>
                <td><input type="text" id="name" name="name"></td>
            </tr>
            <tr>
                <td><label for="nim">NIM</label></td>
                <td>:</td>
                <td><input type="text" id="nim" name="nim"></td>
            </tr>
            <tr>
                <td><label for="birth_date">Birth Of Date</label></td>
                <td>:</td>
                <td><input type="date" id="birth_date" name="birth_date"></td>
            </tr>
            <tr>
                <td><label for="birth_place">Birth Of Place</label></td>
                <td>:</td>
                <td><input type="text" id="birth_place" name="birth_place"></td>
            </tr>
            <tr>
                <td><label for="username">Username</label></td>
                <td>:</td>
                <td><input type="text" id="username" name="username"></td>
            </tr>
            <tr>
                <td><label for="password">Password</label></td>
                <td>:</td>
                <td><input type="password" id="password" name="password"></td>
            </tr>
            <tr>
                <td><label for="confirm_password">Confirm-Password</label></td>
                <td>:</td>
                <td><input type="password" id="confirm_password" name="confirm_password"></td>
            </tr>
            <tr>
                <td></td>
                <td></td>
                <td>
                    <br>
                    <button type="submit">Register</button>
                </td>
            </tr>
        </table>
    </form>
